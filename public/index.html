<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Curd Runner: The Last Wheel</title>
<meta name="description" content="A cyberpunk match-3 about the end of cheese. HTML5, single file, built for embedding.">
<style>
:root{
  --luna1:#0058ee;--luna2:#3593ff;--luna3:#288eff;--luna4:#127dff;--luna5:#036ffc;
  --xp-face:#ece9d8;--xp-dark:#0a246a;
  --neon-cyan:#00f0ff;--neon-mag:#ff2bd6;--neon-yel:#ffe600;--neon-grn:#39ff14;--neon-red:#ff3b3b;--neon-pur:#b14cff;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#05010d;font-family:Tahoma,"Trebuchet MS",Verdana,Arial,sans-serif;font-size:11px;color:#000;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#desktop{position:fixed;inset:0;overflow:clip;background:
  radial-gradient(ellipse at 50% 70%, rgba(177,76,255,.18) 0%, transparent 55%),
  radial-gradient(ellipse at 50% 40%, #1a0b3a 0%, #07020f 60%, #000 100%)}
#gridwrap{position:absolute;inset:0;overflow:clip;pointer-events:none;contain:strict}
#grid{position:absolute;inset:0;pointer-events:none;opacity:.35;
  background-image:linear-gradient(rgba(0,240,255,.25) 1px,transparent 1px),linear-gradient(90deg,rgba(255,43,214,.25) 1px,transparent 1px);
  background-size:48px 48px;transform:perspective(600px) rotateX(60deg) translateY(30%) scale(2.2);transform-origin:50% 100%}
#scan{position:absolute;inset:0;pointer-events:none;z-index:55;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.12) 0 2px,transparent 2px 4px)}
#vignette{position:absolute;inset:0;pointer-events:none;z-index:54;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.65) 100%)}
#board{position:absolute;z-index:10;touch-action:none;cursor:pointer;border-radius:10px;
  box-shadow:0 0 0 2px rgba(0,240,255,.35),0 0 30px rgba(0,240,255,.25),0 0 80px rgba(255,43,214,.15)}

/* ---------- XP chrome ---------- */
.xp-win{position:absolute;background:var(--xp-face);border:3px solid #0831d9;border-top:0;border-radius:0 0 5px 5px;
  box-shadow:0 0 14px rgba(0,240,255,.25),0 6px 16px rgba(0,0,0,.6);z-index:20}
.xp-title{height:25px;margin:0 -3px;background:linear-gradient(180deg,#0058ee 0%,#3593ff 8%,#288eff 40%,#127dff 88%,#036ffc 100%);
  color:#fff;font-weight:bold;font-size:12px;line-height:25px;padding:0 6px 0 7px;border-radius:7px 7px 0 0;text-shadow:1px 1px #0a246a;
  display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;box-shadow:inset 0 1px 0 rgba(255,255,255,.45)}
.xp-title .ic{width:14px;height:14px;border-radius:2px;flex:none}
.xp-title .ctl{margin-left:auto;display:flex;gap:2px}
.xp-x,.xp-min{width:21px;height:21px;border-radius:3px;border:1px solid #fff;color:#fff;font-weight:bold;text-align:center;line-height:19px;font-size:13px;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.3);font-family:"Trebuchet MS",Tahoma;cursor:default}
.xp-x{background:linear-gradient(180deg,#e9a28a,#d85a3a 50%,#c43a1a)}
.xp-min{background:linear-gradient(180deg,#5c93f7,#2d6bde 50%,#1d4fb8)}
.xp-body{padding:8px;font-size:11px}
.xp-button{font:11px Tahoma,Verdana,sans-serif;padding:4px 14px;min-width:76px;border:1px solid #003c74;border-radius:3px;color:#000;
  background:linear-gradient(180deg,#fff,#ecebe5 85%,#d8d2bd);cursor:pointer;box-shadow:inset -1px -1px 0 #d6d0bd,inset 1px 1px 0 #fff}
.xp-button:hover{box-shadow:inset 0 0 0 2px #f8d383,inset 0 0 0 3px #e5a93b}
.xp-button:active{background:linear-gradient(180deg,#d8d2bd,#ecebe5)}
.xp-button.default{box-shadow:inset 0 0 0 1px #0f6ddb,inset 0 0 0 2px #5ea1ff}
.xp-progress{height:16px;border:1px solid #686868;background:#fff;padding:2px;box-shadow:inset 1px 1px 2px rgba(0,0,0,.25);border-radius:2px;overflow:hidden}
.xp-progress>i{display:block;height:100%;width:0;transition:width .35s ease-out;
  background:repeating-linear-gradient(90deg,transparent 0 1px,#fff 1px 2px,transparent 2px 10px),linear-gradient(180deg,#5ef26a,#2fb735 45%,#189a22)}
.xp-group{border:1px solid #d0d0bf;border-radius:4px;padding:8px 8px 6px;margin-top:10px;position:relative}
.xp-group>legend,.xp-group .lg{position:absolute;top:-8px;left:8px;background:var(--xp-face);padding:0 4px;color:#0046d5}
.big{font:bold 22px "Trebuchet MS",Tahoma;color:#0a246a;letter-spacing:.5px}
.muted{color:#555}
.stars{font-size:18px;color:#e5a93b;text-shadow:0 0 6px #ffe600;letter-spacing:2px}
.kv{display:flex;justify-content:space-between;margin:3px 0}

/* HUD placement (Halo-style corners, XP skin) */
#w-score{left:12px;top:12px;width:212px;transform:perspective(900px) rotateY(9deg);transform-origin:right center}
#w-obj{right:12px;top:12px;width:224px;transform:perspective(900px) rotateY(-9deg);transform-origin:left center}
#w-rennet{left:12px;bottom:44px;width:212px;transform:perspective(900px) rotateY(9deg);transform-origin:right center}
#w-rennet .port{display:flex;gap:8px;align-items:center}
#w-rennet .port svg{width:56px;height:56px;flex:none;background:#000;border:1px solid #003c74;border-radius:3px}
#w-rennet .status{font-style:italic;color:#333;min-height:28px}
#wheel{width:52px;height:52px;border-radius:50%;flex:none;border:3px solid #b8860b;position:relative;
  background:conic-gradient(#ffd23f var(--p,0%),#5a4a1a 0);box-shadow:inset 0 0 0 3px #e2b84a,0 0 10px rgba(255,210,63,.6)}
#wheel::after{content:"";position:absolute;inset:0;border-radius:50%;
  background:radial-gradient(circle at 30% 35%,rgba(0,0,0,.35) 0 4px,transparent 5px),radial-gradient(circle at 65% 60%,rgba(0,0,0,.35) 0 3px,transparent 4px),radial-gradient(circle at 45% 70%,rgba(0,0,0,.35) 0 2px,transparent 3px)}
.narrow #w-score,.narrow #w-obj,.narrow #w-rennet{transform:none}
.narrow #w-score{left:4px;top:4px;width:calc(50% - 6px)}
.narrow #w-obj{right:4px;top:4px;width:calc(50% - 6px)}
.narrow #w-rennet{display:none}
.narrow .xp-body{padding:5px 6px}
.narrow .big{font-size:16px}
.narrow .hide-n{display:none}

/* taskbar */
#taskbar{position:absolute;left:0;right:0;bottom:0;height:30px;z-index:60;display:flex;align-items:center;
  background:linear-gradient(180deg,#3168d5 0,#245edb 6%,#2b64dd 50%,#1e4fc4 100%);border-top:1px solid #6b93f2}
#start{height:30px;padding:0 22px 0 8px;background:linear-gradient(180deg,#3c9a3c,#2d842d 50%,#1e6e1e);border-radius:0 14px 14px 0;color:#fff;
  font:italic bold 16px "Trebuchet MS",Tahoma,sans-serif;text-shadow:1px 1px #0d3d0d;display:flex;align-items:center;gap:6px;cursor:pointer;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.25),2px 0 6px rgba(0,0,0,.4)}
#start:hover{filter:brightness(1.12)}
.flag{width:16px;height:14px;display:grid;grid-template-columns:1fr 1fr;gap:1px;transform:skewY(-6deg)}
.flag i{display:block}.flag i:nth-child(1){background:#f25022}.flag i:nth-child(2){background:#7fba00}.flag i:nth-child(3){background:#00a4ef}.flag i:nth-child(4){background:#ffb900}
.task-item{margin-left:8px;height:22px;padding:0 10px;background:linear-gradient(#3c81f3,#2a6be0);border-radius:3px;color:#fff;font-weight:bold;
  display:flex;align-items:center;gap:6px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.3);white-space:nowrap;overflow:hidden}
#tray{margin-left:auto;height:30px;background:linear-gradient(180deg,#0f9ff7,#0c86e0 10%,#0b7bdc 50%,#0a6bc9 100%);border-left:1px solid #1a4fa8;
  padding:0 10px 0 12px;display:flex;align-items:center;gap:10px;color:#fff;font-size:11px;box-shadow:inset 1px 0 0 rgba(255,255,255,.3)}
.tray-ic{cursor:pointer;width:18px;height:18px;display:flex;align-items:center;justify-content:center;font-size:13px}
.tray-ic:hover{filter:drop-shadow(0 0 3px #fff)}
#startmenu{position:absolute;left:0;bottom:30px;width:230px;z-index:65;display:none;background:var(--xp-face);border:2px solid #0831d9;border-radius:6px 6px 0 0;overflow:hidden;box-shadow:4px -4px 12px rgba(0,0,0,.5)}
#startmenu.show{display:block}
#startmenu .head{background:linear-gradient(180deg,#1c5fdd,#3b8af2 40%,#1c5fdd);color:#fff;font-weight:bold;font-size:13px;padding:10px;display:flex;align-items:center;gap:8px;text-shadow:1px 1px #0a246a}
#startmenu .head svg{width:36px;height:36px;border:2px solid #fff;border-radius:4px;background:#000}
#startmenu .item{padding:7px 12px;cursor:pointer;display:flex;align-items:center;gap:8px;border-bottom:1px solid #e6e2d0}
#startmenu .item:hover{background:#316ac5;color:#fff}
#startmenu .foot{background:linear-gradient(180deg,#3b8af2,#1c5fdd);padding:6px 10px;color:#fff;font-size:10px;text-align:right}

/* balloon */
#balloon{position:absolute;right:14px;bottom:44px;max-width:270px;background:#ffffe1;border:1px solid #000;border-radius:6px;padding:7px 10px 8px;
  box-shadow:3px 3px 8px rgba(0,0,0,.5);z-index:70;display:none;font-size:11px}
#balloon.show{display:block;animation:pop .18s ease-out}
#balloon::after{content:"";position:absolute;right:26px;bottom:-13px;border:7px solid transparent;border-top:7px solid #000;border-bottom:0}
#balloon::before{content:"";position:absolute;right:27px;bottom:-11px;border:6px solid transparent;border-top:6px solid #ffffe1;border-bottom:0;z-index:1}
#balloon b{display:flex;align-items:center;gap:5px;margin-bottom:3px}
#balloon .bx{position:absolute;right:5px;top:4px;width:14px;height:14px;border:1px solid #000;font-size:10px;line-height:12px;text-align:center;cursor:pointer;background:#fff}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}

/* modal */
#modal{position:absolute;inset:0;background:rgba(0,0,20,.45);display:none;align-items:center;justify-content:center;z-index:80;padding:10px;overflow:clip}
#modal.show{display:flex}
#modal .xp-win{position:relative;width:min(440px,96vw);animation:pop .18s ease-out;transform:none}
.dlg-row{display:flex;gap:10px;align-items:flex-start}
.dlg-row svg{width:72px;height:72px;flex:none;background:#000;border:1px solid #003c74;border-radius:3px}
.dlg-text{flex:1;min-height:72px;line-height:1.45;font-size:12px}
.dlg-text b{color:#0046d5}
.dlg-btns{display:flex;gap:6px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap}

/* BSOD */
#bsod{position:absolute;inset:0;background:#0000aa;color:#fff;font:13px/1.5 "Lucida Console",Consolas,Monaco,monospace;padding:6vh 6vw;z-index:90;display:none;white-space:pre-wrap;cursor:pointer}
#bsod.show{display:block}
#bsod .hdr{background:#aaaaaa;color:#0000aa;display:inline-block;padding:0 6px;margin-bottom:12px}

/* boot */
#boot{position:absolute;inset:0;background:#000;z-index:95;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;cursor:pointer}
#boot .logo{font:italic bold clamp(28px,7vw,54px) "Trebuchet MS",Tahoma,sans-serif;letter-spacing:-1px;
  background:linear-gradient(90deg,#00f0ff,#ff2bd6,#ffe600);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 14px rgba(0,240,255,.6))}
#boot .sub{font:clamp(14px,3vw,22px) "Trebuchet MS",Tahoma;color:#cfd8ff;margin-top:4px;letter-spacing:4px;text-transform:uppercase}
#boot .bar{margin-top:40px;width:180px;height:14px;border:1px solid #889;border-radius:3px;overflow:hidden;position:relative}
#boot .bar i{position:absolute;top:2px;bottom:2px;width:36px;background:repeating-linear-gradient(90deg,#3a6ef0 0 8px,transparent 8px 10px);animation:slide 1.4s linear infinite}
@keyframes slide{from{left:-40px}to{left:180px}}
#boot .small{position:absolute;bottom:20px;font-size:11px;color:#777}
#boot.welcome{background:linear-gradient(180deg,#5a7edc 0,#3a5fc9 50%,#2a4ab8 100%)}
#boot.welcome .logo{color:#fff;background:none;-webkit-text-fill-color:#fff;filter:drop-shadow(2px 2px 2px rgba(0,0,0,.4))}
#boot.welcome .bar,#boot.welcome .sub{display:none}

/* glitch */
@keyframes glitch{0%{filter:none;transform:none}15%{filter:hue-rotate(60deg) saturate(2);transform:translate(-3px,1px)}30%{filter:hue-rotate(-60deg);transform:translate(3px,-2px)}45%{filter:invert(.1) contrast(1.4);transform:translate(-1px,2px)}60%{filter:none;transform:translate(2px,0)}100%{filter:none;transform:none}}
.glitch{animation:glitch .45s steps(2,end) 1}
#flash{position:absolute;inset:0;pointer-events:none;z-index:52;background:#fff;opacity:0;transition:opacity .25s}
.combo-banner{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:40;pointer-events:none;
  font:italic bold clamp(28px,8vw,72px) "Trebuchet MS",Tahoma,sans-serif;color:#fff;text-shadow:0 0 12px #ff2bd6,0 0 30px #ff2bd6,3px 3px 0 #00f0ff;
  animation:banner .9s ease-out forwards;white-space:nowrap}
@keyframes banner{0%{opacity:0;transform:translate(-50%,-50%) scale(.4) rotate(-6deg)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.15) rotate(2deg)}70%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-70%) scale(1.1)}}
</style>
</head>
<body>
<div id="desktop">
  <div id="gridwrap"><div id="grid"></div></div>

  <div id="modal"></div>

<script>
(()=>{
'use strict';
/* =====================================================================
   CURD RUNNER: The Last Wheel
   A cyberpunk match-3 about the end of cheese.
   Single-file HTML5 game. Deployed on Cloudflare Pages, embedded via iframe.
   ===================================================================== */

// ---------- helpers ----------
const $=s=>document.querySelector(s);
const rnd=n=>Math.floor(Math.random()*n);
const pick=a=>a[rnd(a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const easeOut=t=>1-Math.pow(1-t,3);
const easeInOut=t=>t<.5?2*t*t:-1+(4-2*t)*t;
const fmt=n=>Math.round(n).toLocaleString('en-US');
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
let instant=false; // simulation mode: skip animations
function tween(ms,fn){
  if(instant){fn(1);return Promise.resolve();}
  return new Promise(res=>{const t0=performance.now();
    function step(now){const t=clamp((now-t0)/ms,0,1);fn(t);if(t<1)requestAnimationFrame(step);else res();}
    requestAnimationFrame(step);});
}
const wait=ms=>instant?Promise.resolve():sleep(ms);

// ---------- constants ----------
const N=9, TYPES=6;
const COLORS=['#00f0ff','#ff2bd6','#ffe600','#39ff14','#ff3b3b','#b14cff'];
const TNAMES=['Data Chip','Energy Cell','Credit Coin','Neural Implant','Firewall Node','Signal Shard'];
const SP={NONE:0,PLUS:1,SWAP:2,REV:3,SKIP:4,WILD:5};
const SPNAME={1:'+200',2:'SWAP 7',3:'REVERSE',4:'SKIP',5:'WILD'};
const SPBADGE={1:'+200',2:'⇄7',3:'REV',4:'SKIP'};
const SPUNLOCK={1:2,2:3,3:4,4:5}; // sector where each chaos tile unlocks

const LEVELS=[
  {name:'The Dairy Flats',      target:1000, moves:20},
  {name:'Rind Row',             target:1500, moves:22},
  {name:'The Curdled Market',   target:1900, moves:24},
  {name:'Whey Station',         target:2300, moves:24},
  {name:"Casein's Checkpoint",  target:2700, moves:26},
  {name:'The Lactose Tunnels',  target:3100, moves:26},
  {name:'Fondue Falls',         target:3600, moves:28},
  {name:'The Mold Gardens',     target:4000, moves:28},
  {name:'Vault Approach',       target:4500, moves:30},
  {name:'The Vault',            target:5200, moves:32},
];

// ---------- story ----------
const R='rennet',B='brie',C='casein';
const L=(who,text)=>({who,text});
const STORY=[
 {intro:[L(R,"Boot sequence complete. Neural jack at 61%. Good morning, Brie. The world still has no cheese."),
         L(B,"Then why'd you wake me up."),
         L(R,"A job. Someone claims the last wheel of aged gouda is in a vault under Neo-Wisconsin. The client pays in <b>actual butter</b>."),
         L(B,"...Butter. Fine. Where do we start?"),
         L(R,"The Dairy Flats. Swap adjacent salvage nodes to line up three of a kind and crack the perimeter locks. Try not to die, I'm still paying off this implant.")],
  outro:[L(R,"Perimeter down. I'm picking up a transmission. Someone named <b>Lord Casein</b> is very upset that you exist."),
         L(B,"Who?"),
         L(R,"Warlord. Runs the Rind. Hoards powdered milk like it's uranium. He wants the wheel too.")]},
 {intro:[L(R,"Rind Row. Casein's turf. I've patched a bonus routine into your jack: match <b>four</b> nodes in a line and you'll spawn a <b>+200</b> credit cache. Match it to cash it."),
         L(B,"Why does everything look like a Windows dialog box?"),
         L(R,"Your implant runs on a 2003 kernel, Brie. Be grateful it runs at all.")],
  outro:[L(C,"COURIER. You walk through MY row with MY future wheel in your head?"),
         L(B,"It's not in my head. It's in a vault."),
         L(C,"SEMANTICS. The Rind remembers."),
         L(R,"He hung up. Dramatic. Let's move.")]},
 {intro:[L(R,"The Curdled Market. Black-market whey, bootleg crackers. I found a glitch in the lock grid: a <b>Swap 7</b> node teleports seven tiles at random when matched."),
         L(B,"That sounds like chaos."),
         L(R,"It is. Chaos is on our side today.")],
  outro:[L(R,"Market's clear. Also I bought you a cracker. Metaphorically. We have no money.")]},
 {intro:[L(R,"Whey Station. The gravity generators are failing here. A <b>Reverse</b> node flips the grid for three turns. Tiles fall <b>up</b>."),
         L(B,"That's not how gravity works."),
         L(R,"Take it up with the apocalypse.")],
  outro:[L(B,"I think I'm getting the hang of this."),
         L(R,"Don't say that. Every time a protagonist says that...")]},
 {intro:[L(C,"Checkpoint. Papers. Or cheese. You have neither."),
         L(R,"Brie, I've unlocked a <b>Skip</b> node. Match it and I refund your move. Legally, that's not cheating."),
         L(B,"Legally there are no laws."),
         L(R,"Exactly.")],
  outro:[L(C,"You got through. FINE. But the tunnels are mine. My raiders will <b>curdle</b> your grid."),

const semi=(f,s)=>f*Math.pow(2,s/12);
function startMusic(){
  if(!AU.ctx||MUSIC.timer)return;
  MUSIC.nextTime=now()+0.1;MUSIC.step=0;
  MUSIC.timer=setInterval(()=>{

    while(MUSIC.nextTime<now()+0.15){scheduleStep(MUSIC.step,MUSIC.nextTime,stepLen);MUSIC.step=(MUSIC.step+1)%128;MUSIC.nextTime+=stepLen;}
  },40);
}
function scheduleStep(s,t,len){
  const bar=Math.floor(s/16),ci=Math.floor(bar/2)%4,root=ROOTS[ci],ch=CHORD[ci],inBar=s%16,d=AU.mus;
  if(inBar%4===0){ // kick
    const o=AU.ctx.createOscillator(),g=AU.ctx.createGain();o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(40,t+.18);
    g.gain.setValueAtTime(.7,t);g.gain.exponentialRampToValueAtTime(.001,t+.25);o.connect(g);g.connect(d);o.start(t);o.stop(t+.3);}
  if(inBar%2===1)noiseHit(t,.04,.08,7000,d); // hats
  if(inBar===4||inBar===12){noiseHit(t,.14,.16,1500,d);note(190,t,.12,'sine',.18,d);} // snare
  if(inBar%2===0){ // bass 8ths
    const oct=(inBar%8===6)?12:0;
    if(AU.ctx){const o=AU.ctx.createOscillator(),f=AU.ctx.createBiquadFilter(),g=AU.ctx.createGain();o.type='sawtooth';o.frequency.value=semi(root,oct);
      f.type='lowpass';f.frequency.setValueAtTime(900,t);f.frequency.exponentialRampToValueAtTime(250,t+len*2);
      g.gain.setValueAtTime(.22,t);g.gain.exponentialRampToValueAtTime(.001,t+len*1.9);o.connect(f);f.connect(g);g.connect(d);o.start(t);o.stop(t+len*2);}
  }
  { // arp 16ths
    const pat=[0,1,2,3,2,1,0,2,1,3,2,0,3,1,2,1];const iv=ch[pat[inBar]];
    const o=AU.ctx.createOscillator(),f=AU.ctx.createBiquadFilter(),g=AU.ctx.createGain();o.type='square';o.frequency.value=semi(root*4,iv);
    f.type='lowpass';f.frequency.value=2200;g.gain.setValueAtTime(.05,t);g.gain.exponentialRampToValueAtTime(.001,t+len*.9);
    o.connect(f);f.connect(g);g.connect(d);o.start(t);o.stop(t+len);
  }
  if(s%32===0){ // pad every chord change
    ch.slice(0,3).forEach(iv=>note(semi(root*2,iv),t,len*32,'triangle',.045,d,len*6,len*30));
  }
  if(bar%8===6&&inBar%2===0){ // lead fill every 8 bars
    const mel=[12,15,19,24,19,15,12,7];note(semi(root*4,mel[inBar/2]),t,len*1.8,'triangle',.08,d,.01);
  }
}

// ---------- matching ----------
function findMatches(g=grid){
  const runs=[];
  for(let r=0;r<N;r++){let c=0;while(c<N){const x=g[r][c];const t=x?x.t:-1;if(t<0){c++;continue;}let e=c;while(e+1<N&&g[r][e+1]&&g[r][e+1].t===t)e++;
    if(e-c+1>=3){const cells=[];for(let k=c;k<=e;k++)cells.push(r*N+k);runs.push({cells,dir:'h',t});}c=e+1;}}
  for(let c=0;c<N;c++){let r=0;while(r<N){const x=g[r][c];const t=x?x.t:-1;if(t<0){r++;continue;}let e=r;while(e+1<N&&g[e+1][c]&&g[e+1][c].t===t)e++;
    if(e-r+1>=3){const cells=[];for(let k=r;k<=e;k++)cells.push(k*N+c);runs.push({cells,dir:'v',t});}r=e+1;}}
  if(!runs.length)return [];
  const parent=new Map();const find=k=>{while(parent.get(k)!==k){parent.set(k,parent.get(parent.get(k)));k=parent.get(k);}return k;};
  for(const run of runs){for(const k of run.cells){if(!parent.has(k))parent.set(k,k);const a=find(run.cells[0]),b=find(k);if(a!==b)parent.set(a,b);}}
  const groups=new Map();
  for(const run of runs){const root=find(run.cells[0]);let g2=groups.get(root);if(!g2){g2={cells:new Set(),runs:[],t:run.t,maxLen:0,h:false,v:false};groups.set(root,g2);}
    g2.runs.push(run);g2.maxLen=Math.max(g2.maxLen,run.cells.length);if(run.dir==='h')g2.h=true;else g2.v=true;for(const k of run.cells)g2.cells.add(k);}
  return [...groups.values()];
}
function groupSpecial(g){if(g.maxLen>=5)return SP.WILD;if((g.h&&g.v)||g.maxLen>=4)return pickChaos();return 0;}
function swapCells(a,b){const ta=grid[a.r][a.c],tb=grid[b.r][b.c];grid[a.r][a.c]=tb;grid[b.r][b.c]=ta;}
function hasMoves(){
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){const t=grid[r][c];if(!t)return false;if(t.sp===SP.WILD)return true;}
  const tryS=(a,b)=>{const ta=grid[a.r][a.c],tb=grid[b.r][b.c];if(ta.lock||tb.lock)return false;swapCells(a,b);const ok=findMatches().length>0;swapCells(a,b);return ok;};
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){if(c<N-1&&tryS({r,c},{r,c:c+1}))return true;if(r<N-1&&tryS({r,c},{r:r+1,c}))return true;}
  return false;
}
function bestMove(){ // greedy: swap producing the most cleared cells (used by simulation only)
  let best=null,bs=0;
  const tryS=(a,b)=>{const ta=grid[a.r][a.c],tb=grid[b.r][b.c];if(ta.lock||tb.lock)return;if(ta.sp===SP.WILD||tb.sp===SP.WILD){if(bs<4){bs=4;best=[a,b];}return;}
    swapCells(a,b);const gs=findMatches();let n=0;for(const g of gs)n+=g.cells.size+(g.maxLen>=4?2:0);swapCells(a,b);if(n>bs){bs=n;best=[a,b];}};
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){if(c<N-1)tryS({r,c},{r,c:c+1});if(r<N-1)tryS({r,c},{r:r+1,c});}
  return best;
}

async function gravity(){
  const down=reverseTurns<=0;const movers=[];
  for(let c=0;c<N;c++){
    const col=[];
    if(down){for(let r=N-1;r>=0;r--)if(grid[r][c])col.push(grid[r][c]);
      let r=N-1;for(const t of col){grid[r][c]=t;movers.push([t,r]);r--;}
      let k=0;for(;r>=0;r--){const t=mkTile(rnd(TYPES),r,c);t.y=-1-k;k++;grid[r][c]=t;movers.push([t,r]);}
    }else{for(let r=0;r<N;r++)if(grid[r][c])col.push(grid[r][c]);
      let r=0;for(const t of col){grid[r][c]=t;movers.push([t,r]);r++;}
      let k=0;for(;r<N;r++){const t=mkTile(rnd(TYPES),r,c);t.y=N+k;k++;grid[r][c]=t;movers.push([t,r]);}
    }
  }
  const starts=movers.map(([t])=>t.y);
  const maxD=Math.max(1,...movers.map(([t,r],i)=>Math.abs(r-starts[i])));
  await tween(90+maxD*55,p=>{movers.forEach(([t,r],i)=>{const d=Math.abs(r-starts[i]);if(!d){t.y=r;return;}const e=easeOut(Math.min(1,p*maxD/d));t.y=starts[i]+(r-starts[i])*e;t.s=1;t.a=1;t.rot=0;});});
  for(const [t,r] of movers){t.y=r;}
}

  await tween(200,p=>{for(const t of tiles){t.s=1-p;t.rot=p*3;}});
  let tries=0;
  do{for(let i=tiles.length-1;i>0;i--){const j=rnd(i+1);[tiles[i],tiles[j]]=[tiles[j],tiles[i]];}
    let i=0;for(let r=0;r<N;r++)for(let c=0;c<N;c++){grid[r][c]=tiles[i++];grid[r][c].x=c;grid[r][c].y=r;}
    tries++;}while((findMatches().length||!hasMoves())&&tries<200);
  await tween(200,p=>{for(const t of tiles){t.s=p;t.rot=3-p*3;}});
}

function spawnParticles(x,y,col,n){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,v=0.02+Math.random()*0.08;particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-0.02,life:1,col,sz:2+Math.random()*3,spark:Math.random()<.3});}}

function comboBanner(text){if(instant)return;const d=document.createElement('div');d.className='combo-banner';d.textContent=text;$('#desktop').appendChild(d);setTimeout(()=>d.remove(),950);}
function glitch(){if(instant)return;const d=$('#desktop');d.classList.remove('glitch');void d.offsetWidth;d.classList.add('glitch');}

// ---------- scoring & resolve ----------
function lvlMult(){return endless?1+(endRound-1)*0.1:1+(level-1)*0.15;}
function addScore(n){score+=n;if(endless&&score>save.high){save.high=score;}}
async function resolveBoard(focus){
  let combo=0;
  while(true){
    const groups=findMatches();if(!groups.length)break;
    combo++;comboShown=combo;updateHUD();
    const clear=new Set(),spawns=[];let pts=0;
    for(const g of groups){
      for(const k of g.cells)clear.add(k);
      const sp=groupSpecial(g);
      if(sp){let at=null;if(focus)for(const f of focus){const k=f.r*N+f.c;if(g.cells.has(k)){at=k;break;}}
        if(at==null){const arr=[...g.cells];at=arr[Math.floor(arr.length/2)];}spawns.push({k:at,sp});}
      let p=g.cells.size*10;if(g.maxLen>=5)p+=80;else if(g.h&&g.v)p+=50;else if(g.maxLen>=4)p+=30;pts+=p;
    }
    const effects=[];
    for(const k of clear){const t=grid[k/N|0][k%N];if(t&&t.sp&&t.sp!==SP.WILD)effects.push(t.sp);if(t&&t.lock)locksBroken++;}
    for(const s of spawns)clear.delete(s.k);
    const gained=Math.round(pts*combo*lvlMult());addScore(gained);
    const arr=[...clear];const mid=arr[Math.floor(arr.length/2)];
    floatText(mid%N+.5,(mid/N|0)+.5,'+'+gained,combo>1?'#ffe600':'#fff');
    SFX.ding(combo);
    if(combo===3){comboBanner('COMBO ×3');SFX.sparkle(8);quip();}
    else if(combo>=4){comboBanner(combo>=6?'UNSTOPPABLE':'COMBO ×'+combo);SFX.sparkle(12);glitch();if(combo>=5)achieve('combo5','Combo ×5','Five cascades in one move. The grid is scared.');}
    await animateClear(clear,combo);
    for(const k of clear)grid[k/N|0][k%N]=null;
    for(const s of spawns){const t=grid[s.k/N|0][s.k%N];if(!t)continue;t.sp=s.sp;t.lock=false;if(s.sp===SP.WILD){t.t=-1;achieve('wild','Wild spawned','Match five in a line. You did that.');}
      else achieve('chaos','Chaos unlocked','Your first chaos tile. Match it to trigger it.');
      floatText(t.x+.5,t.y-.2,SPNAME[s.sp],'#fff');if(!instant){spawnParticles(t.x+.5,t.y+.5,'#fff',14);}
      flash(.25);}
    focus=null;
    let doSwap7=false;
    for(const e of effects){chaosCount++;
      if(e===SP.PLUS){addScore(200);SFX.plus();flash(.4);balloon('Credit cache','+200 credits recovered.','💰');}
      else if(e===SP.SWAP){doSwap7=true;balloon('Swap 7','Seven tiles teleported. Chaos is on our side.','⇄');}
      else if(e===SP.REV){reverseTurns=3;SFX.reverse();glitch();balloon('Gravity reversed','Tiles fall UP for 3 turns.','⇅');}
      else if(e===SP.SKIP){if(cfg.limited){movesLeft++;}movesUsed=Math.max(0,movesUsed-1);SFX.skip();balloon('Move refunded','Skip node matched. Legally not cheating.','↩');}
      if(chaosCount===10)achieve('chaos10','Agent of chaos','Ten chaos tiles triggered.');
    }
    updateHUD();
    await gravity();
    if(doSwap7)await swapSeven();
  }
  comboShown=Math.max(1,combo);updateHUD();
  return combo;
}
async function wildClear(color,wilds){
  const clear=new Set();for(const w of wilds)clear.add(w.r*N+w.c);
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){const t=grid[r][c];if(t&&(color===-2||t.t===color))clear.add(r*N+c);}
  for(const k of clear){const t=grid[k/N|0][k%N];if(t&&t.lock)locksBroken++;}
  const gained=Math.round(clear.size*15*lvlMult());addScore(gained);
  SFX.wild();glitch();flash(.6);comboBanner(color===-2?'TOTAL WIPE':'WILD');
  floatText(4.5,4.5,'+'+gained,'#fff');
  await animateClear(clear,3);
  for(const k of clear)grid[k/N|0][k%N]=null;
  updateHUD();
  await gravity();
  await resolveBoard(null);
}

// ---------- input ----------
function cellAt(px,py){const rect=canvas.getBoundingClientRect();const x=(px-rect.left-pad)/cell,y=(py-rect.top-pad)/cell;const c=Math.floor(x),r=Math.floor(y);if(c<0||r<0||c>=N||r>=N)return null;return {r,c};}
canvas.addEventListener('pointerdown',e=>{audioInit();audioResume();if(state!=='idle')return;const cl=cellAt(e.clientX,e.clientY);if(!cl)return;drag={cl,x:e.clientX,y:e.clientY};
  if(sel&&adjacent(sel,cl)){const a=sel;sel=null;drag=null;trySwap(a,cl);}else{sel=cl;SFX.select();}});
canvas.addEventListener('pointermove',e=>{if(!drag||state!=='idle')return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.hypot(dx,dy)<cell*0.35)return;
  const a=drag.cl;let b;if(Math.abs(dx)>Math.abs(dy))b={r:a.r,c:a.c+Math.sign(dx)};else b={r:a.r+Math.sign(dy),c:a.c};drag=null;sel=null;
  if(b.r<0||b.c<0||b.r>=N||b.c>=N)return;trySwap(a,b);});
window.addEventListener('pointerup',()=>{drag=null;});
window.addEventListener('pointercancel',()=>{drag=null;});
function adjacent(a,b){return Math.abs(a.r-b.r)+Math.abs(a.c-b.c)===1;}
async function trySwap(a,b){
  if(state!=='idle')return;
  const ta=grid[a.r][a.c],tb=grid[b.r][b.c];if(!ta||!tb)return;
  if(ta.lock||tb.lock){SFX.donk();shakeTile(ta.lock?ta:tb);balloon('Lord Casein','That tile is curdled. Match through it to break the lock.','🔒');return;}
  state='busy';
  swapCells(a,b);SFX.swap();await animSwap(a,b);
  if(ta.sp===SP.WILD||tb.sp===SP.WILD){
    useMove();
    const wilds=[];let color;
    if(ta.sp===SP.WILD&&tb.sp===SP.WILD){color=-2;wilds.push(b,a);}
    else if(ta.sp===SP.WILD){color=tb.t;wilds.push(b);}else{color=ta.t;wilds.push(a);}
    await wildClear(color,wilds);
    await afterMove();return;
  }
  if(!findMatches().length){swapCells(a,b);await animSwap(a,b);SFX.donk();state='idle';return;}
  useMove();
  await resolveBoard([a,b]);
  await afterMove();
}
function shakeTile(t){if(instant)return;const x0=t.x;tween(260,p=>{t.x=x0+Math.sin(p*Math.PI*6)*0.12*(1-p);});}
function useMove(){movesUsed++;if(cfg.limited)movesLeft--;if(reverseTurns>0)reverseTurns--;caseinCounter++;updateHUD();}
async function afterMove(){
  // Casein's raiders lock tiles
  const caseinOn=endless||level>=6;const every=endless?5:6;
  if(caseinOn&&caseinCounter>=every&&score<cfg.target){caseinCounter=0;await caseinLock();}
  if(score>=cfg.target){await levelClear();return;}
  if(cfg.limited&&movesLeft<=0){await bsod();return;}
  if(!hasMoves()){await shuffleBoard();}
  state='idle';
}
async function caseinLock(){
  const cands=[];for(let r=0;r<N;r++)for(let c=0;c<N;c++){const t=grid[r][c];if(t&&!t.lock&&!t.sp)cands.push(t);}
  const n=Math.min(cands.length,endless?3:2);const got=[];
  for(let i=0;i<n;i++)got.push(cands.splice(rnd(cands.length),1)[0]);
  if(!caseinWarned){caseinWarned=true;balloon('Lord Casein','My raiders are curdling your grid, courier.','☠');}
  SFX.lock();
  await tween(220,p=>{for(const t of got){t.s=1+Math.sin(p*Math.PI)*0.25;}});
  for(const t of got){t.lock=true;t.s=1;}
}

function dialog({title='Neural jack',who=null,text='',buttons=['OK'],html=''}){
  return new Promise(res=>{
    const m=$('#modal');
    m.innerHTML=`<div class="xp-win"><div class="xp-title"><span class="ic" style="background:linear-gradient(135deg,#39ff14,#00f0ff)"></span>${title}<span class="ctl"><span class="xp-x">×</span></span></div>

      <div class="dlg-btns">${buttons.map((b,i)=>`<button class="xp-button${i===buttons.length-1?' default':''}" data-i="${i}">${b}</button>`).join('')}</div></div></div>`;
    m.classList.add('show');
    const tw=m.querySelector('.tw');let i=0;const full=text;let done=false;
    // typewriter (HTML-aware: reveal by char count using a temp element)
    const tmp=document.createElement('div');tmp.innerHTML=full;const plain=tmp.textContent;
    const iv=setInterval(()=>{i+=2;if(i>=plain.length){tw.innerHTML=full;clearInterval(iv);done=true;}else tw.textContent=plain.slice(0,i);},16);
    const finish=idx=>{clearInterval(iv);m.classList.remove('show');m.innerHTML='';window.removeEventListener('keydown',key);SFX.click();res(idx);};
    m.querySelectorAll('button').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();if(!done&&buttons.length===1){clearInterval(iv);tw.innerHTML=full;done=true;return;}finish(+b.dataset.i);}));
    const key=e=>{if(e.key==='Enter'||e.key===' '){if(!done){clearInterval(iv);tw.innerHTML=full;done=true;}else finish(buttons.length-1);}};
    window.addEventListener('keydown',key);
  });
}

function layout(){

  const W=innerWidth,H=innerHeight,wide=W>=820;
  document.body.classList.toggle('narrow',!wide);
  const top=wide?10:76,side=wide?240:6,bottom=38;
  boardPx=Math.max(160,Math.min(W-side*2,H-top-bottom));
  pad=Math.round(boardPx*0.03);cell=(boardPx-pad*2)/N;
  canvas.style.width=canvas.style.height=boardPx+'px';
  canvas.style.left=((W-boardPx)/2)+'px';canvas.style.top=(top+(H-top-bottom-boardPx)/2)+'px';
  canvas.width=canvas.height=Math.round(boardPx*dpr);
  spriteCache.clear();
}

function roundRect(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function drawGlyph(c,t,s){
  const col=COLORS[t],h=s/2;
  c.lineWidth=Math.max(2,s*0.09);c.strokeStyle=col;c.fillStyle=col;c.shadowColor=col;c.shadowBlur=s*0.35;c.lineJoin='round';c.lineCap='round';
  switch(t){
    case 0:{roundRect(c,-h*.6,-h*.6,h*1.2,h*1.2,h*.15);c.globalAlpha=.22;c.fill();c.globalAlpha=1;c.stroke();
      c.beginPath();for(let i=-1;i<=1;i++){const o=i*h*.38;c.moveTo(o,-h*.6);c.lineTo(o,-h*.9);c.moveTo(o,h*.6);c.lineTo(o,h*.9);c.moveTo(-h*.6,o);c.lineTo(-h*.9,o);c.moveTo(h*.6,o);c.lineTo(h*.9,o);}c.stroke();
      c.fillRect(-h*.22,-h*.22,h*.44,h*.44);break;}
    case 1:{c.beginPath();for(let i=0;i<6;i++){const a=Math.PI/3*i-Math.PI/6;const x=Math.cos(a)*h*.85,y=Math.sin(a)*h*.85;i?c.lineTo(x,y):c.moveTo(x,y);}c.closePath();c.globalAlpha=.2;c.fill();c.globalAlpha=1;c.stroke();
      c.beginPath();c.moveTo(h*.12,-h*.6);c.lineTo(-h*.3,h*.08);c.lineTo(h*.02,h*.08);c.lineTo(-h*.12,h*.6);c.lineTo(h*.3,-h*.08);c.lineTo(-h*.02,-h*.08);c.closePath();c.fill();break;}
    case 2:{c.beginPath();c.arc(0,0,h*.82,0,Math.PI*2);c.globalAlpha=.2;c.fill();c.globalAlpha=1;c.stroke();c.beginPath();c.arc(0,0,h*.55,0,Math.PI*2);c.stroke();
      c.font='bold '+Math.round(s*.5)+'px Tahoma,Verdana,sans-serif';c.textAlign='center';c.textBaseline='middle';c.fillText('¢',0,h*.04);break;}
    case 3:{c.beginPath();c.moveTo(0,-h*.9);c.lineTo(h*.9,0);c.lineTo(0,h*.9);c.lineTo(-h*.9,0);c.closePath();c.globalAlpha=.2;c.fill();c.globalAlpha=1;c.stroke();
      c.beginPath();c.arc(0,0,h*.3,0,Math.PI*2);c.stroke();[[0,-h*.9],[h*.9,0],[0,h*.9],[-h*.9,0]].forEach(([x,y])=>{c.beginPath();c.arc(x*.5,y*.5,h*.08,0,Math.PI*2);c.fill();});break;}
    case 4:{c.beginPath();c.moveTo(-h*.8,-h*.75);c.lineTo(h*.8,-h*.75);c.lineTo(h*.8,h*.1);c.quadraticCurveTo(h*.8,h*.7,0,h*.95);c.quadraticCurveTo(-h*.8,h*.7,-h*.8,h*.1);c.closePath();c.globalAlpha=.2;c.fill();c.globalAlpha=1;c.stroke();
      c.lineWidth=Math.max(1.5,s*.05);c.beginPath();c.moveTo(-h*.8,-h*.3);c.lineTo(h*.8,-h*.3);c.moveTo(-h*.75,h*.15);c.lineTo(h*.75,h*.15);c.moveTo(0,-h*.75);c.lineTo(0,-h*.3);c.moveTo(-h*.4,-h*.3);c.lineTo(-h*.4,h*.15);c.moveTo(h*.4,-h*.3);c.lineTo(h*.4,h*.15);c.stroke();break;}
    case 5:{c.beginPath();for(let i=0;i<8;i++){const a=Math.PI/4*i-Math.PI/2;const r=i%2?h*.35:h*.95;const x=Math.cos(a)*r,y=Math.sin(a)*r;i?c.lineTo(x,y):c.moveTo(x,y);}c.closePath();c.globalAlpha=.25;c.fill();c.globalAlpha=1;c.stroke();
      c.beginPath();c.arc(0,0,h*.14,0,Math.PI*2);c.fill();break;}
  }
}
function sprite(t,sp,lock){
  const key=t+':'+sp+':'+(lock?1:0);let s=spriteCache.get(key);if(s)return s;
  const size=Math.ceil(cell*dpr),cv=document.createElement('canvas');cv.width=cv.height=size;const c=cv.getContext('2d');
  c.scale(dpr,dpr);c.translate(cell/2,cell/2);
  const g=cell*0.72;
  if(sp===SP.WILD){
    const grad=c.createConicGradient?c.createConicGradient(0,0,0):null;
    if(grad){COLORS.forEach((col,i)=>grad.addColorStop(i/6,col));grad.addColorStop(1,COLORS[0]);c.fillStyle=grad;}else c.fillStyle='#fff';
    c.shadowColor='#fff';c.shadowBlur=g*.4;c.beginPath();c.arc(0,0,g*.46,0,Math.PI*2);c.fill();
    c.shadowBlur=0;c.fillStyle='#000';c.beginPath();c.arc(0,0,g*.28,0,Math.PI*2);c.fill();
    c.fillStyle='#fff';c.font='bold '+Math.round(g*.42)+'px Tahoma';c.textAlign='center';c.textBaseline='middle';c.fillText('W',0,1);
  }else{
    drawGlyph(c,t,g);
    if(sp){c.shadowBlur=0;c.save();c.translate(cell*.5,cell*.5);const txt=SPBADGE[sp];c.font='bold '+Math.round(cell*.2)+'px Tahoma,Verdana';const w=c.measureText(txt).width+cell*.12,h=cell*.26;
      roundRect(c,-w,-h,w,h,3);c.fillStyle='#fff';c.fill();c.lineWidth=1.5;c.strokeStyle='#0831d9';c.stroke();c.fillStyle='#0a246a';c.textAlign='center';c.textBaseline='middle';c.fillText(txt,-w/2,-h/2+1);c.restore();}
  }
  if(lock){c.shadowBlur=0;c.save();c.globalAlpha=.55;c.fillStyle='#000';roundRect(c,-cell/2+2,-cell/2+2,cell-4,cell-4,6);c.fill();c.globalAlpha=.6;c.strokeStyle='#cfd8dc';c.lineWidth=1.5;c.beginPath();for(let i=-cell;i<cell;i+=7){c.moveTo(i,-cell/2);c.lineTo(i+cell,cell/2);}c.stroke();
    c.globalAlpha=1;c.fillStyle='#ddd';c.strokeStyle='#ddd';c.lineWidth=2.5;const k=cell*.16;c.beginPath();c.arc(0,-k*.4,k*.7,Math.PI,0);c.stroke();roundRect(c,-k,-k*.3,k*2,k*1.6,2);c.fill();c.restore();}
  spriteCache.set(key,cv);return cv;
}
let lastT=performance.now();
function draw(now_){
  requestAnimationFrame(draw);
  const dt=Math.min(50,now_-lastT);lastT=now_;
  ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,boardPx,boardPx);
  // panel
  const grad=ctx.createLinearGradient(0,0,boardPx,boardPx);grad.addColorStop(0,'rgba(10,4,30,.92)');grad.addColorStop(1,'rgba(2,8,20,.92)');
  roundRect(ctx,0,0,boardPx,boardPx,10);ctx.fillStyle=grad;ctx.fill();
  ctx.strokeStyle='rgba(0,240,255,.12)';ctx.lineWidth=1;ctx.beginPath();
  for(let i=0;i<=N;i++){const p=pad+i*cell;ctx.moveTo(pad,p);ctx.lineTo(pad+N*cell,p);ctx.moveTo(p,pad);ctx.lineTo(p,pad+N*cell);}ctx.stroke();
  if(reverseTurns>0){ctx.fillStyle='rgba(255,43,214,.07)';ctx.fillRect(pad,pad,N*cell,N*cell);}
  // selection
  if(sel&&state==='idle'){const pulse=.5+.5*Math.sin(now_/150);ctx.strokeStyle=`rgba(255,255,255,${.5+pulse*.5})`;ctx.lineWidth=3;ctx.shadowColor='#fff';ctx.shadowBlur=12;roundRect(ctx,pad+sel.c*cell+2,pad+sel.r*cell+2,cell-4,cell-4,8);ctx.stroke();ctx.shadowBlur=0;}
  // tiles
  ctx.save();ctx.beginPath();ctx.rect(pad-2,pad-2,N*cell+4,N*cell+4);ctx.clip();
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){const t=grid[r]&&grid[r][c];if(!t||t.a<=0)continue;
    const img=sprite(t.t,t.sp,t.lock);const px=pad+t.x*cell+cell/2,py=pad+t.y*cell+cell/2;
    ctx.save();ctx.globalAlpha=clamp(t.a,0,1);ctx.translate(px,py);let rot=t.rot||0;if(t.sp===SP.WILD)rot+=now_/600;ctx.rotate(rot);
    let sc=t.s;if(t.sp&&t.sp!==SP.WILD)sc*=1+.05*Math.sin(now_/180);ctx.scale(sc,sc);ctx.drawImage(img,-cell/2,-cell/2,cell,cell);ctx.restore();}
  // particles
  for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx*dt/16;p.y+=p.vy*dt/16;p.vy+=0.003*dt/16;p.life-=dt/700;if(p.life<=0){particles.splice(i,1);continue;}
    ctx.globalAlpha=p.life;ctx.fillStyle=p.col;const px=pad+p.x*cell,py=pad+p.y*cell;
    if(p.spark){ctx.save();ctx.translate(px,py);ctx.rotate(p.life*4);ctx.fillRect(-p.sz*1.5,-p.sz*.3,p.sz*3,p.sz*.6);ctx.fillRect(-p.sz*.3,-p.sz*1.5,p.sz*.6,p.sz*3);ctx.restore();}
    else{ctx.beginPath();ctx.arc(px,py,p.sz*p.life,0,Math.PI*2);ctx.fill();}}
  ctx.globalAlpha=1;ctx.restore();
  // floats
  for(let i=floats.length-1;i>=0;i--){const f=floats[i];f.life-=dt/900;f.y-=dt/1600;if(f.life<=0){floats.splice(i,1);continue;}
    ctx.globalAlpha=Math.min(1,f.life*2);ctx.fillStyle=f.col;ctx.font='bold '+Math.round(cell*.55)+'px "Trebuchet MS",Tahoma';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.shadowColor='#ff2bd6';ctx.shadowBlur=10;ctx.fillText(f.text,pad+f.x*cell,pad+f.y*cell);ctx.shadowBlur=0;}
  ctx.globalAlpha=1;
  // score counter
  if(cfg){disp+=(score-disp)*0.18;if(Math.abs(score-disp)<1)disp=score;$('#score').textContent=fmt(disp);}
}

// ---------- boot ----------
async function boot(){
  layout();cfg={limited:save.limited,target:1,moves:1,name:''};genBoard();requestAnimationFrame(draw);
  const b=$('#boot');let skipped=false;const skip=()=>{skipped=true;};b.addEventListener('click',skip,{once:true});
  for(let i=0;i<22&&!skipped;i++)await sleep(100);
  b.classList.add('welcome');b.querySelector('.logo').textContent='welcome';
  for(let i=0;i<12&&!skipped;i++)await sleep(100);
  b.style.transition='opacity .5s';b.style.opacity=0;await sleep(500);b.remove();
  mainMenu();
}
document.addEventListener('pointerdown',()=>{audioInit();audioResume();},{passive:true});
boot();

// ---------- debug/simulation hooks (balance testing; not used by the game loop) ----------
window.__dbg={get grid(){return grid;},get state(){return state;},get score(){return score;},set movesLeft(v){movesLeft=v;updateHUD();},get level(){return level;},bestMove,cellCenter(r,c){const k=canvas.getBoundingClientRect();return [k.left+pad+(c+.5)*cell,k.top+pad+(r+.5)*cell];}};
window.__sim=async function(levelN,trials=20,limited=true,targetOverride=null){
  const results=[];const prevInstant=instant;instant=true;
  const saveState={level,endless,cfg,score,movesUsed,movesLeft,reverseTurns,grid,state};
  for(let t=0;t<trials;t++){
    level=levelN;endless=false;cfg=Object.assign({},LEVELS[levelN-1],{limited});if(targetOverride)cfg.target=targetOverride;resetRound();genBoard();state='busy';
    let hit=false;
    while(movesLeft>0){const mv=bestMove();if(!mv){if(!hasMoves()){await shuffleBoard();continue;}break;}
      const [a,b]=mv;const ta=grid[a.r][a.c],tb=grid[b.r][b.c];swapCells(a,b);
      if(ta.sp===SP.WILD||tb.sp===SP.WILD){useMove();const wilds=[];let color;if(ta.sp===SP.WILD&&tb.sp===SP.WILD){color=-2;wilds.push(b,a);}else if(ta.sp===SP.WILD){color=tb.t;wilds.push(b);}else{color=ta.t;wilds.push(a);}await wildClear(color,wilds);}
      else{useMove();await resolveBoard([a,b]);}
      const caseinOn=level>=6;if(caseinOn&&caseinCounter>=6&&score<cfg.target){caseinCounter=0;await caseinLock();}
      if(score>=cfg.target){hit=true;break;}
      if(!hasMoves())await shuffleBoard();
    }
    results.push({score,movesUsed,hit,stars:hit?starsFor():0});
  }
  Object.assign({},saveState);level=saveState.level;endless=saveState.endless;cfg=saveState.cfg;score=saveState.score;movesUsed=saveState.movesUsed;movesLeft=saveState.movesLeft;reverseTurns=saveState.reverseTurns;grid=saveState.grid;state=saveState.state;
  instant=prevInstant;balloonQ.length=0;
  const hits=results.filter(r=>r.hit).length;const avg=results.reduce((a,r)=>a+r.score,0)/results.length;const avgMoves=results.filter(r=>r.hit).reduce((a,r)=>a+r.movesUsed,0)/Math.max(1,hits);
  return {level:levelN,target:LEVELS[levelN-1].target,moves:LEVELS[levelN-1].moves,winRate:hits/results.length,avgScore:Math.round(avg),avgMovesToClear:Math.round(avgMoves*10)/10,stars:results.map(r=>r.stars).join('')};
};
})();
